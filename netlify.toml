# Netlify configuration for PEP Landbank Sales Portal
# Static single-page PWA — no build step, served from the repo root.
# With this file present, Netlify auto-detects the correct settings,
# so there is nothing to configure by hand in the Netlify UI.

[build]
  publish = "."
  command = ""

# Never cache the service worker or the app shell, so updates you push
# reach every device on the next load instead of being stuck on an old copy.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
